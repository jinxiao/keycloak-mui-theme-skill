interface:
  display_name: "Keycloak MUI Theme"
  short_description: "Create and review Keycloak MUI themes with latest stable Storybook coverage."
  default_prompt: "Create or update a Keycloak theme that follows the correct official Keycloak source contract first: FTL parity for login/email themes and React console parity for admin/account themes. Preserve existing configured theme scopes, follow MUI-native components, colors, icons, sizing consistency, login-by-default new scope behavior, latest stable Storybook setup, complete stories for implemented FTL pages or React console modules, and current GitHub Actions runtimes."
